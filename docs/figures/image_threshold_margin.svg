<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- Illustration of docs/architecture_v0.1.md, section 7.5: where the image
       threshold is placed for one fixed score method. Illustrative values. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- White background, so that the figure stays readable in dark mode. -->
  <rect x="0" y="0" width="820" height="350" fill="#ffffff"/>

  <!-- Legend -->
  <circle cx="80" cy="14" r="5" fill="#2563eb"/>
  <text x="91" y="18" fill="#222">authentic patch</text>
  <rect x="215" y="9" width="10" height="10" fill="#ea580c"/>
  <text x="231" y="18" fill="#222">forged patch</text>

  <!-- Band of equally good thresholds: between the highest authentic score
       (0.30, y = 226) and the lowest forged score (0.66, y = 125.2). -->
  <rect x="70" y="125.2" width="490" height="100.8" fill="#dbeafe" opacity="0.7"/>
  <text x="80" y="147" fill="#1e3a8a" font-size="12">any threshold in this band gives the same decisions on val</text>

  <!-- Axes: y = 310 - 280 * score -->
  <line x1="70" y1="30" x2="70" y2="310" stroke="#333"/>
  <line x1="70" y1="310" x2="560" y2="310" stroke="#333"/>
  <line x1="65" y1="310" x2="70" y2="310" stroke="#333"/>
  <line x1="65" y1="170" x2="70" y2="170" stroke="#333"/>
  <line x1="65" y1="30" x2="70" y2="30" stroke="#333"/>
  <text x="60" y="314" text-anchor="end" fill="#222">0</text>
  <text x="60" y="174" text-anchor="end" fill="#222">0.5</text>
  <text x="60" y="34" text-anchor="end" fill="#222">1</text>
  <text x="22" y="170" text-anchor="middle" fill="#222" transform="rotate(-90 22 170)">score of the patch (method X, fixed)</text>
  <text x="315" y="332" text-anchor="middle" fill="#222">validation patches (order irrelevant)</text>

  <!-- The two edges of the band (dashed) and the chosen threshold (solid). -->
  <line x1="70" y1="125.2" x2="560" y2="125.2" stroke="#666" stroke-dasharray="6 4"/>
  <line x1="70" y1="226" x2="560" y2="226" stroke="#666" stroke-dasharray="6 4"/>
  <line x1="70" y1="175.6" x2="560" y2="175.6" stroke="#111" stroke-width="2.5"/>

  <!-- Authentic patches (blue circles): scores 0.02 to 0.30 -->
  <circle cx="95" cy="296" r="5" fill="#2563eb"/>
  <circle cx="141" cy="276.4" r="5" fill="#2563eb"/>
  <circle cx="164" cy="301.6" r="5" fill="#2563eb"/>
  <circle cx="233" cy="251.2" r="5" fill="#2563eb"/>
  <circle cx="279" cy="287.6" r="5" fill="#2563eb"/>
  <circle cx="348" cy="226" r="5" fill="#2563eb"/>
  <circle cx="394" cy="268" r="5" fill="#2563eb"/>
  <circle cx="417" cy="304.4" r="5" fill="#2563eb"/>
  <circle cx="463" cy="282" r="5" fill="#2563eb"/>
  <circle cx="532" cy="259.6" r="5" fill="#2563eb"/>

  <!-- Forged patches (orange squares): scores 0.66 to 0.97 -->
  <rect x="113" y="47.4" width="10" height="10" fill="#ea580c"/>
  <rect x="182" y="78.2" width="10" height="10" fill="#ea580c"/>
  <rect x="205" y="33.4" width="10" height="10" fill="#ea580c"/>
  <rect x="251" y="120.2" width="10" height="10" fill="#ea580c"/>
  <rect x="297" y="58.6" width="10" height="10" fill="#ea580c"/>
  <rect x="320" y="95" width="10" height="10" fill="#ea580c"/>
  <rect x="366" y="39" width="10" height="10" fill="#ea580c"/>
  <rect x="435" y="69.8" width="10" height="10" fill="#ea580c"/>
  <rect x="481" y="109" width="10" height="10" fill="#ea580c"/>
  <rect x="504" y="53" width="10" height="10" fill="#ea580c"/>

  <!-- Rings on the two patches that bound the band. -->
  <circle cx="256" cy="125.2" r="10" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="348" cy="226" r="10" fill="none" stroke="#111" stroke-width="1.5"/>

  <!-- Margin: width of the band. -->
  <line x1="566" y1="128" x2="566" y2="223" stroke="#333" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="576" y="157" fill="#222" font-style="italic">margin 0.36</text>

  <!-- Labels of the three lines -->
  <text x="576" y="129" fill="#444">lowest forged score (0.66)</text>
  <text x="576" y="180" fill="#111" font-weight="bold">threshold = middle (0.48)</text>
  <text x="576" y="230" fill="#444">highest authentic score (0.30)</text>
</svg>
