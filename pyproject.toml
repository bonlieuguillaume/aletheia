[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia"
version = "0.1.0"
description = "Detection of manually tampered and AI-generated SAR images."
requires-python = ">=3.10"
# torch / torchvision are NOT listed: Colab already ships a CUDA build,
# reinstalling them from PyPI would waste minutes and can break CUDA.
dependencies = [
    "numpy",
    "pillow",
    "tifffile",
    "pyyaml",
    "scikit-learn",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
