# ImageNet-pretrained ResNet18, conv1 averaged to 1 channel.
seed: 0
output_dir: runs

data:
  root: data
  class_names: [real, fake]
  img_size: 256
  log_transform: true

model:
  name: resnet18
  pretrained: true

train:
  epochs: 20
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 1.0e-4
  num_workers: 2
  class_weights: true
  grad_clip: 1.0
